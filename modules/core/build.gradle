plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'com.gradleup.shadow' version '9.0.2'
    id 'idea'
    id 'builder.kasuga.generator'
    id 'builder.kasuga.resource-compiler'
}


version = mod_version
group = mod_group_id

useGenerator(project)

var find = gradle.getIncludedBuilds()*.any {
    it.name == "KasugaLibNext"
}.contains(true)

ext.useBundle = { dependency ->
    if(find) {
        dependency.attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

base {
    archivesName = mod_id
}

configurations {
    shadowLibrary
    implementation.extendsFrom shadowLibrary
}

sourceSets {
    main {
        resources {
            srcDir "src/compiled/resources/"
        }
    }
}

test {
    useJUnitPlatform()
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // Inlcude the core subproject as a dependency.
            sourceSet(sourceSets.main)
        }
    }
}


configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-aop:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    annotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'

    implementation("lib.kasuga:kasuga_lib:1.0.0") {
        useBundle(delegate)
        exclude group: 'com.simibubi.create', module: "create-${minecraft_version}"
        exclude group: 'net.createmod.ponder', module: "Ponder-NeoForge-${minecraft_version}"
        exclude group: 'dev.engine-room.flywheel', module: "flywheel-neoforge-api-${minecraft_version}"
        exclude group: 'dev.engine-room.flywheel', module: "flywheel-neoforge-${minecraft_version}"

        exclude group: 'com.tterrag.registrate', module: 'Registrate'
        transitive = false
    }

    implementation("lib.kasuga:inject:1.0.0"){
        transitive = false
    }


    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    //compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    additionalRuntimeClasspath 'org.jgrapht:jgrapht-core:1.5.2'
    shadowLibrary 'org.jgrapht:jgrapht-core:1.5.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.shadowJar {
    zip64 = true
        // 明确指定仅包含shadowLibrary配置的依赖，避免继承多余的runtime依赖
    configurations = [project.configurations.shadowLibrary]
    // 追加全局排除规则，确保所有前置和加载器内容完全不被打包
     // ==========================================
    // 1. 【核心代码】排除游戏核心、前置模组及加载器
    // ==========================================
    exclude 'net/minecraft/**'          // Minecraft 核心 (合并了重复项)
    exclude 'net/neoforged/**'          // NeoForge 核心 (合并了重复项)
    exclude 'cpw/mods/**'               // ModLauncher (合并了重复项)
    
    // 前置模组代码 (合并了重复项，使用更通用的父级路径以覆盖子模块)
    exclude 'com/simibubi/**'           // 覆盖 Create 及其子包
    exclude 'net/createmod/**'          // 覆盖 Ponder 及其子包
    exclude 'dev/engine_room/**'        // 覆盖 Flywheel 及其子包
    exclude 'com/tterrag/**'            // 覆盖 Registrate (合并了重复项)

    // ==========================================
    // 2. 【第三方库】排除游戏自带或冲突库
    // ==========================================
    // 注意：org/apache/** 已经包含了 log4j，无需单独写 log4j 路径
    exclude 'org/apache/**'             // Log4j, Commons, HttpClient 等
    exclude 'org/slf4j/**'              // SLF4J
    exclude 'org/lwjgl/**'              // LWJGL
    exclude 'com/google/**'             // Gson, Guava (除非你重定位了 gson，否则建议排除游戏自带的)
    exclude 'it/unimi/**'               // FastUtil
    exclude 'oshi/**'                   // OSHI
    exclude 'mozilla/**'                // Rhino
    exclude 'javax/**'                  // Java EE
    // jakarta/** 需谨慎：如果你重定位了 jakarta.inject，则不需要排除整个 jakarta 包
    // 如果未重定位且游戏自带 jakarta，则排除；如果重定位了，保留重定位规则即可，无需排除
    
    // ==========================================
    // 3. 【精准清理】排除根目录残留的配置文件和资源
    // ==========================================
    // 这些文件不在上述包路径下，必须单独排除
    
    // Flywheel/Create/Ponder 配置
    exclude 'flywheel.mixins.json'
    exclude 'flywheel.impl.mixins.json'
    exclude 'flywheel.backend.mixins.json'
    exclude 'flywheel.refmap.json'
    exclude 'create.mixins.json'
    exclude 'ponder.mixins.json'
    exclude 'ponder-common.mixins.json'
    
    // NeoForge/Minecraft 配置
    exclude 'neoforge.mixins.json'
    exclude 'neoforged_logo.png'
    exclude 'neoforged_icon.png'
    exclude 'mcplogo.png'
    exclude 'forge.exc'
    exclude 'forge.sas'
    exclude 'forge.srg'
    
    // 其他杂乱资源
    exclude 'fox_running.png'
    exclude 'squirrel.png'
    exclude 'url.png'
    exclude 'Monocraft.ttf'
    exclude 'flightrecorder-config.jfc'
    exclude 'log4j2.xml'
    exclude 'Log4j-*.properties'
    exclude 'Log4j-*.xsd'
    exclude 'Log4j-*.dtd'
    exclude 'oshi.properties'
    exclude 'oshi.*.properties'

    // ==========================================
    // 4. 【元数据清理】排除签名和文档
    // ==========================================
    exclude 'linux/**'
    exclude 'reports/**'
    exclude 'licenses/**'
    exclude 'LICENSE*'
    exclude '*.txt'
    exclude '*.md'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    
    // 可选：排除特定的 SPI 服务文件（如果担心冲突）
    // 通常 mergeServiceFiles() 会处理大部分情况，但如果特定服务导致冲突，可在此排除
    // exclude 'META-INF/services/net.neoforged.**'
    // exclude 'META-INF/services/com.simibubi.**'

    // ==========================================
    // 5. 【关键】重定位你自己的依赖
    // ==========================================
    relocate 'io.micronaut', 'cn.kycraft.kuayue.shaded.io.micronaut'
    relocate 'jakarta.inject', 'cn.kycraft.kuayue.shaded.jakarta.inject'
    relocate 'org.apfloat', 'cn.kycraft.kuayue.shaded.org.apfloat'
    relocate 'org.jgrapht', 'cn.kycraft.kuayue.shaded.org.jgrapht'
    relocate 'org.jheaps', 'cn.kycraft.kuayue.shaded.org.jheaps'
    
    // 注意：如果你排除了 com/google/**，就不要重定位 com.google.gson，否则会导致类找不到
    // 建议：要么排除 com/google/** 并使用游戏自带的 Gson，要么重定位 com.google.gson 并不要排除它
    // 这里假设你希望使用重定位后的 Gson：
    // relocate 'com.google.gson', 'cn.kycraft.kuayue.shaded.com.google.gson' 
    // 并且注释掉上面的 exclude 'com/google/**'
    
    relocate 'lib.kasuga.inject', 'lib.kasuga.vendors.inject'
    configurations = [project.configurations.shadowLibrary, project.configurations.implementation]

    mergeServiceFiles()
}
