plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'com.gradleup.shadow' version '9.0.2'
    id 'idea'
    id 'builder.kasuga.generator'
    id 'builder.kasuga.resource-compiler'
}


version = mod_version
group = mod_group_id

useGenerator(project)

var find = gradle.getIncludedBuilds()*.any {
    it.name == "KasugaLibNext"
}.contains(true)

ext.useBundle = { dependency ->
    if(find) {
        dependency.attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

base {
    archivesName = mod_id
}

configurations {
    shadowLibrary
    implementation.extendsFrom shadowLibrary
}

sourceSets {
    main {
        resources {
            srcDir "src/compiled/resources/"
        }
    }
}

test {
    useJUnitPlatform()
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // Inlcude the core subproject as a dependency.
            sourceSet(sourceSets.main)
        }
    }
}


configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-aop:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    annotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'

    implementation("lib.kasuga:kasuga_lib:1.0.0") {
        useBundle(delegate)
        exclude group: 'com.simibubi.create', module: "create-${minecraft_version}"
        exclude group: 'net.createmod.ponder', module: "Ponder-NeoForge-${minecraft_version}"
        exclude group: 'dev.engine-room.flywheel', module: "flywheel-neoforge-api-${minecraft_version}"
        exclude group: 'dev.engine-room.flywheel', module: "flywheel-neoforge-${minecraft_version}"

        exclude group: 'com.tterrag.registrate', module: 'Registrate'
        transitive = false
    }

    implementation("lib.kasuga:inject:1.0.0"){
        transitive = false
    }


    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    additionalRuntimeClasspath 'org.jgrapht:jgrapht-core:1.5.2'
    shadowLibrary 'org.jgrapht:jgrapht-core:1.5.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.shadowJar {
    zip64 = true
        // 明确指定仅包含shadowLibrary配置的依赖，避免继承多余的runtime依赖
    configurations = [project.configurations.shadowLibrary]
    // 追加全局排除规则，确保所有前置和加载器内容完全不被打包
    exclude 'net/neoforged/**'
    exclude 'net/minecraft/**'
    exclude 'cpw/mods/**'
    exclude 'com/simibubi/create/**'
    exclude 'net/createmod/ponder/**'
    exclude 'com/tterrag/registrate/**'
    exclude 'dev/engine_room/flywheel/**'
    exclude 'org/apache/logging/log4j/**'
    exclude 'META-INF/services/net.neoforged/**'
    exclude 'META-INF/services/com/simibubi/create/**'
    exclude 'META-INF/services/cpw/**'
    // exclude 'org/jgrapht/**'
    // exclude 'org/jheaps/**'
    // exclude 'org/apfloat/**'
    //exclude 'org/**'       // 排除 org.apache, org.jgrapht, org.jheaps, org.apfloat 等
    //exclude 'com/google/**' // 排除 Gson, Guava 等
    //exclude 'it/unimi/**'   // 排除 fastutil 等
    //exclude 'javax/**'      // 排除 javax 相关

        // 1. 重定位 apfloat 及其相关依赖
    // 将所有 org.apfloat 开头的类移动到 com.kuayue.shaded.org.apfloat
    relocate 'org.apfloat', 'com.kuayue.shaded.org.apfloat'
    
    // 2. 如果还有其他冲突库（如 jheaps, jgrapht），也一起重定位
    relocate 'org.jheaps', 'com.kuayue.shaded.org.jheaps'
    relocate 'org.jgrapht', 'com.kuayue.shaded.org.jgrapht'
    
    // 3. 可选：重定位其他常见冲突库
    relocate 'com.google.gson', 'com.kuayue.shaded.com.google.gson'
    
    // 注意：不再需要 exclude 'org/apfloat/**'，因为 relocate 会处理它们
    // 但为了保险，可以保留对其他无关大包的排除
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    //解决缺少micronaut的问题
        // ⭐ 关键：必须显式包含所有需要打包的配置
    configurations = [
        project.project.configurations.runtimeClasspath,
        project.configurations.additionalRuntimeClasspath 
    ]

    // ⭐ 关键：执行重定位
    relocate 'io.micronaut', 'cn.kycraft.kuayue.shaded.io.micronaut'
    //relocate 'lib.kasuga.inject', 'lib.kasuga.vendors.inject'
    
    // 合并 SPI 服务文件，否则 Micronaut 无法发现 Bean
    mergeServiceFiles()
}
}
